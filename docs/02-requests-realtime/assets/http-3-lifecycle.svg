<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1194" viewBox="0 0 820 1194" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest></c2pa:manifest>
  </metadata>
  <title id="t">HTTP/3: independent streams over QUIC</title>
  <desc id="d">QUIC and TLS 1.3 handshake together with no TCP setup. After HTTP/3 setup, requests use streams 0 and 4 and responses finish independently. The connection can be reused or closed with QUIC CONNECTION_CLOSE; there are no TCP FIN or ACK exchanges.</desc>
  <defs>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155" />
    </marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#0284c7" />
    </marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#15803d" />
    </marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#a16207" />
    </marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#b91c1c" />
    </marker>
    <marker id="mp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#6d28d9" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f1f5f9" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3" />
    </pattern>
  </defs>
  <rect width="820" height="1194" rx="12" fill="#fff" />
  <g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
    <text x="410.0" y="36" font-size="24" font-weight="600" text-anchor="middle">HTTP/3: independent streams over QUIC</text>
    <text x="410.0" y="62" font-size="15" fill="#475569" text-anchor="middle">Fresh connection · UDP underneath · time flows downward</text>
    <rect x="25" y="80" width="170" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" />
    <text x="110" y="106" font-size="16" font-weight="600" text-anchor="middle">Browser (client)</text>
    <rect x="315" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" />
    <text x="400" y="106" font-size="16" font-weight="600" text-anchor="middle">Server</text>
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 120V922M400 120V922" />
    </g>
    <rect x="16" y="140" width="788" height="170" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 180V310M400 180V310" />
    </g>
    <text x="32" y="166" font-size="16" font-weight="600" text-anchor="start">1 · QUIC + TLS handshake together</text>
    <path d="M110 202H400" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)" />
    <text x="255" y="193" font-size="15" fill="#5b21b6" text-anchor="middle">ClientHello (offers h3)</text>
    <path d="M400 248H110" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)" />
    <text x="255" y="239" font-size="15" fill="#5b21b6" text-anchor="middle">ServerHello, cert, Finished</text>
    <path d="M110 294H400" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)" />
    <text x="255" y="285" font-size="15" fill="#5b21b6" text-anchor="middle">Client Finished</text>
    <text x="432" y="192" font-size="14" fill="#1e293b" text-anchor="start">No separate TCP handshake. QUIC runs</text>
    <text x="432" y="211" font-size="14" fill="#1e293b" text-anchor="start">over UDP and carries the TLS handshake</text>
    <text x="432" y="230" font-size="14" fill="#1e293b" text-anchor="start">inside its own packets. Encryption is</text>
    <text x="432" y="249" font-size="14" fill="#1e293b" text-anchor="start">part of setup, not an extra step.</text>
    <rect x="16" y="326" width="788" height="104" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 366V430M400 366V430" />
    </g>
    <text x="32" y="352" font-size="16" font-weight="600" text-anchor="start">2 · HTTP/3 setup</text>
    <path d="M110 388H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" marker-start="url(#mk)" />
    <text x="255" y="379" font-size="15" fill="#0f172a" text-anchor="middle">Control streams + SETTINGS</text>
    <text x="432" y="378" font-size="14" fill="#1e293b" text-anchor="start">Each side opens control streams</text>
    <text x="432" y="397" font-size="14" fill="#1e293b" text-anchor="start">and announces its settings.</text>
    <rect x="16" y="446" width="788" height="124" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 486V570M400 486V570" />
    </g>
    <text x="32" y="472" font-size="16" font-weight="600" text-anchor="start">3 · Two requests, separate streams</text>
    <path d="M110 508H400" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mb)" />
    <text x="255" y="499" font-size="15" font-weight="600" fill="#075985" text-anchor="middle">Stream 0 · GET /users</text>
    <path d="M110 554H400" stroke="#15803d" stroke-width="2.5" marker-end="url(#mg)" />
    <text x="255" y="545" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">Stream 4 · GET /orders</text>
    <text x="432" y="498" font-size="14" fill="#1e293b" text-anchor="start">Client-started streams are 0, 4, 8…</text>
    <text x="432" y="517" font-size="14" fill="#1e293b" text-anchor="start">Each stream is independent.</text>
    <rect x="16" y="586" width="788" height="216" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 626V802M400 626V802" />
    </g>
    <text x="32" y="612" font-size="16" font-weight="600" text-anchor="start">4 · Responses finish independently</text>
    <path d="M400 648H110" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mb)" />
    <text x="255" y="639" font-size="15" font-weight="600" fill="#075985" text-anchor="middle">S0 · HEADERS :status 200</text>
    <path d="M400 694H110" stroke="#15803d" stroke-width="2.5" marker-end="url(#mg)" />
    <text x="255" y="685" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">S4 · HEADERS :status 200</text>
    <path d="M400 740H110" stroke="#15803d" stroke-width="2.5" marker-end="url(#mg)" />
    <text x="255" y="731" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">S4 · DATA (complete)</text>
    <path d="M400 786H110" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mb)" />
    <text x="255" y="777" font-size="15" font-weight="600" fill="#075985" text-anchor="middle">S0 · DATA (complete)</text>
    <text x="432" y="638" font-size="14" fill="#1e293b" text-anchor="start">Here stream 4 happens to finish</text>
    <text x="432" y="657" font-size="14" fill="#1e293b" text-anchor="start">first. Neither waits for the other.</text>
    <text x="432" y="676" font-size="14" fill="#1e293b" text-anchor="start">If a packet for stream 0 were lost,</text>
    <text x="432" y="695" font-size="14" fill="#1e293b" text-anchor="start">stream 4 could still be delivered.</text>
    <rect x="16" y="818" width="788" height="104" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 858V922M400 858V922" />
    </g>
    <text x="32" y="844" font-size="16" font-weight="600" text-anchor="start">5 · Reuse, or close</text>
    <path d="M110 880H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" marker-start="url(#mk)" />
    <text x="255" y="871" font-size="15" fill="#0f172a" text-anchor="middle">QUIC CONNECTION_CLOSE</text>
    <text x="432" y="870" font-size="14" fill="#1e293b" text-anchor="start">No TCP FIN / ACK exchange.</text>
    <text x="432" y="889" font-size="14" fill="#1e293b" text-anchor="start">Either side can close.</text>
    <rect x="16" y="938" width="788" height="92" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" />
    <text x="32" y="966" font-size="15" font-weight="600" fill="#92400e" text-anchor="start">Key idea</text>
    <text x="32" y="992" font-size="16" font-weight="600" text-anchor="start">Received data on other streams need not wait for this stream's recovery.</text>
    <text x="32" y="1016" font-size="16" text-anchor="start">Streams still share the connection's bandwidth and congestion control.</text>
    <rect x="16" y="1046" width="788" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" />
    <text x="32" y="1070" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Words in this diagram</text>
    <text x="32" y="1094" font-size="14" font-weight="600" text-anchor="start">QUIC</text>
    <text x="170" y="1094" font-size="14" fill="#1e293b" text-anchor="start">transport built on UDP: reliable streams, loss recovery, congestion control</text>
    <text x="32" y="1116" font-size="14" font-weight="600" text-anchor="start">QPACK</text>
    <text x="170" y="1116" font-size="14" fill="#1e293b" text-anchor="start">header compression for HTTP/3 (HTTP/2 uses HPACK)</text>
    <text x="32" y="1138" font-size="14" font-weight="600" text-anchor="start">CONNECTION_CLOSE</text>
    <text x="170" y="1138" font-size="14" fill="#1e293b" text-anchor="start">QUIC message that ends the connection (replaces TCP FIN)</text>
    <text x="410.0" y="1172" font-size="13" fill="#475569" text-anchor="middle">Simplified fresh handshake: Retry, resumption, ACKs and HANDSHAKE_DONE are omitted.</text>
  </g>
</svg>