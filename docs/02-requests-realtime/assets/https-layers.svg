<svg xmlns="http://www.w3.org/2000/svg" width="820" height="600" viewBox="0 0 820 600" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest></c2pa:manifest>
  </metadata>
  <title id="t">HTTPS = HTTP plus a protective layer</title>
  <desc id="d">Two stacks. HTTP/1.1 and HTTP/2 over HTTPS go HTTP, then TLS, then TCP, then the network. HTTP/3 goes HTTP/3, then QUIC with TLS 1.3, then UDP, then the network. HTTPS does not prove the site is honest or that a user may read an order.</desc>
  <defs>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#475569" />
    </marker>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155" />
    </marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#0284c7" />
    </marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#15803d" />
    </marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#a16207" />
    </marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#b91c1c" />
    </marker>
    <marker id="mp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#6d28d9" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f1f5f9" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3" />
    </pattern>
  </defs>
  <rect width="820" height="600" rx="12" fill="#fff" />
  <g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
    <text x="410" y="36" font-size="24" font-weight="600" text-anchor="middle">HTTPS = HTTP plus a protective layer</text>
    <text x="410" y="62" font-size="15" fill="#475569" text-anchor="middle">Follow one request from the client down to the network</text>
    <text x="215" y="102" font-size="17" font-weight="600" text-anchor="middle">HTTP/1.1 and HTTP/2</text>
    <text x="605" y="102" font-size="17" font-weight="600" text-anchor="middle">HTTP/3</text>
    <rect x="30" y="118" width="370" height="88" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="46" y="146" font-size="16" font-weight="600" text-anchor="start">HTTP: what the request means</text>
    <text x="46" y="170" font-size="14" fill="#1e293b" text-anchor="start">GET /products/p123, headers, optional body</text>
    <path d="M215 208V228" stroke="#475569" stroke-width="2.5" marker-end="url(#mk)" />
    <rect x="30" y="230" width="370" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="46" y="258" font-size="16" font-weight="600" text-anchor="start">TLS: protect it</text>
    <text x="46" y="282" font-size="14" fill="#1e293b" text-anchor="start">Encrypts, detects tampering,</text>
    <text x="46" y="302" font-size="14" fill="#1e293b" text-anchor="start">checks the server's certificate</text>
    <path d="M215 320V340" stroke="#475569" stroke-width="2.5" marker-end="url(#mk)" />
    <rect x="30" y="342" width="370" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="46" y="370" font-size="16" font-weight="600" text-anchor="start">TCP: carry it</text>
    <text x="46" y="394" font-size="14" fill="#1e293b" text-anchor="start">Resends lost data, delivers bytes in order</text>
    <text x="46" y="414" font-size="14" fill="#1e293b" text-anchor="start">(does not encrypt)</text>
    <path d="M215 432V452" stroke="#475569" stroke-width="2.5" marker-end="url(#mk)" />
    <rect x="30" y="454" width="370" height="40" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5" />
    <text x="215" y="480" font-size="16" font-weight="600" text-anchor="middle">Network</text>
    <rect x="420" y="118" width="370" height="88" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <text x="436" y="146" font-size="16" font-weight="600" text-anchor="start">HTTP/3: what the request means</text>
    <text x="436" y="170" font-size="14" fill="#1e293b" text-anchor="start">Same methods, headers and statuses, sent as</text>
    <text x="436" y="190" font-size="14" fill="#1e293b" text-anchor="start">binary frames on separate streams</text>
    <path d="M605 208V228" stroke="#475569" stroke-width="2.5" marker-end="url(#mk)" />
    <rect x="420" y="230" width="370" height="88" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="436" y="258" font-size="16" font-weight="600" text-anchor="start">QUIC with TLS 1.3: protect and carry</text>
    <text x="436" y="282" font-size="14" fill="#1e293b" text-anchor="start">Encrypted by design; reliable delivery and</text>
    <text x="436" y="302" font-size="14" fill="#1e293b" text-anchor="start">loss recovery are tracked per stream</text>
    <path d="M605 320V340" stroke="#475569" stroke-width="2.5" marker-end="url(#mk)" />
    <rect x="420" y="342" width="370" height="88" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
    <text x="436" y="370" font-size="16" font-weight="600" text-anchor="start">UDP: send datagrams</text>
    <text x="436" y="394" font-size="14" fill="#1e293b" text-anchor="start">No delivery or order guarantee on its own;</text>
    <text x="436" y="414" font-size="14" fill="#1e293b" text-anchor="start">QUIC adds what is needed on top</text>
    <path d="M605 432V452" stroke="#475569" stroke-width="2.5" marker-end="url(#mk)" />
    <rect x="420" y="454" width="370" height="40" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5" />
    <text x="605" y="480" font-size="16" font-weight="600" text-anchor="middle">Network</text>
    <rect x="16" y="510" width="788" height="76" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" />
    <text x="32" y="536" font-size="15" font-weight="600" fill="#92400e" text-anchor="start">Key idea</text>
    <text x="32" y="560" font-size="16" text-anchor="start">HTTPS protects the trip. It does not prove the site is honest, the backend is secure,</text>
    <text x="32" y="580" font-size="16" text-anchor="start">or that this user may read that order. The application still checks permissions.</text>
  </g>
</svg>