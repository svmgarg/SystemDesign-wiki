<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1117" viewBox="0 0 820 1117" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest></c2pa:manifest>
  </metadata>
  <title id="t">HTTP/1.1: one connection, reused for later requests</title>
  <desc id="d">One TCP handshake, then GET /users with a complete response, then GET /orders on the same connection with no new handshake. An optional FIN/ACK close follows. HTTPS would add a TLS handshake before the first request.</desc>
  <defs>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155" />
    </marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#0284c7" />
    </marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#15803d" />
    </marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#a16207" />
    </marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#b91c1c" />
    </marker>
    <marker id="mp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#6d28d9" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f1f5f9" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3" />
    </pattern>
  </defs>
  <rect width="820" height="1117" rx="12" fill="#fff" />
  <g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
    <text x="410.0" y="36" font-size="24" font-weight="600" text-anchor="middle">HTTP/1.1: one connection, reused for later requests</text>
    <text x="410.0" y="62" font-size="15" fill="#475569" text-anchor="middle">Plain HTTP · requests sent one at a time · time flows downward</text>
    <rect x="25" y="80" width="170" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" />
    <text x="110" y="106" font-size="16" font-weight="600" text-anchor="middle">Browser (client)</text>
    <rect x="315" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" />
    <text x="400" y="106" font-size="16" font-weight="600" text-anchor="middle">Server</text>
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 120V961M400 120V961" />
    </g>
    <rect x="16" y="140" width="788" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 180V310M400 180V310" />
    </g>
    <text x="32" y="166" font-size="16" font-weight="600" text-anchor="start">1 · Open the connection once</text>
    <path d="M110 202H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="193" font-size="15" fill="#0f172a" text-anchor="middle">SYN</text>
    <path d="M400 248H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="239" font-size="15" fill="#0f172a" text-anchor="middle">SYN-ACK</text>
    <path d="M110 294H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="285" font-size="15" fill="#0f172a" text-anchor="middle">ACK</text>
    <text x="432" y="192" font-size="14" fill="#1e293b" text-anchor="start">Done once, then reused.</text>
    <text x="432" y="211" font-size="14" fill="#1e293b" text-anchor="start">Sets up TCP only: no HTTP, no encryption.</text>
    <rect x="16" y="326" width="788" height="123" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 366V449M400 366V449" />
    </g>
    <text x="32" y="352" font-size="16" font-weight="600" text-anchor="start">Optional · TLS handshake (HTTPS only)</text>
    <path d="M110 388H400" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)" marker-start="url(#mp)" />
    <text x="255" y="379" font-size="15" fill="#5b21b6" text-anchor="middle">TLS handshake (HTTPS only)</text>
    <text x="432" y="378" font-size="14" fill="#1e293b" text-anchor="start">Plain HTTP skips this step.</text>
    <text x="432" y="397" font-size="14" fill="#1e293b" text-anchor="start">With HTTPS it runs once, here,</text>
    <text x="432" y="416" font-size="14" fill="#1e293b" text-anchor="start">before the first request.</text>
    <rect x="16" y="465" width="788" height="124" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 505V589M400 505V589" />
    </g>
    <text x="32" y="491" font-size="16" font-weight="600" text-anchor="start">2 · First exchange: /users</text>
    <path d="M110 527H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="518" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">GET /users HTTP/1.1</text>
    <path d="M400 573H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="564" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">200 OK + complete user data</text>
    <text x="432" y="517" font-size="14" fill="#1e293b" text-anchor="start">The response must finish before the</text>
    <text x="432" y="536" font-size="14" fill="#1e293b" text-anchor="start">next request is sent (non-pipelined).</text>
    <rect x="16" y="605" width="788" height="124" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 645V729M400 645V729" />
    </g>
    <text x="32" y="631" font-size="16" font-weight="600" text-anchor="start">3 · Reuse: /orders on the same connection</text>
    <path d="M110 667H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="658" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">GET /orders HTTP/1.1</text>
    <path d="M400 713H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="704" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">200 OK + complete order data</text>
    <text x="432" y="657" font-size="14" fill="#1e293b" text-anchor="start">No new handshake: the connection</text>
    <text x="432" y="676" font-size="14" fill="#1e293b" text-anchor="start">is already open and ready.</text>
    <rect x="16" y="745" width="788" height="216" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 785V961M400 785V961" />
    </g>
    <text x="32" y="771" font-size="16" font-weight="600" text-anchor="start">4 · Idle, or close (browser starts it here)</text>
    <path d="M110 807H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="798" font-size="15" fill="#0f172a" text-anchor="middle">FIN</text>
    <path d="M400 853H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="844" font-size="15" fill="#0f172a" text-anchor="middle">ACK</text>
    <path d="M400 899H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="890" font-size="15" fill="#0f172a" text-anchor="middle">FIN</text>
    <path d="M110 945H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="936" font-size="15" fill="#0f172a" text-anchor="middle">ACK</text>
    <text x="432" y="797" font-size="14" fill="#1e293b" text-anchor="start">Either side may close, for example</text>
    <text x="432" y="816" font-size="14" fill="#1e293b" text-anchor="start">after an idle timeout or when a</text>
    <text x="432" y="835" font-size="14" fill="#1e293b" text-anchor="start">response says Connection: close.</text>
    <rect x="16" y="977" width="788" height="92" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" />
    <text x="32" y="1005" font-size="15" font-weight="600" fill="#92400e" text-anchor="start">Key idea</text>
    <text x="32" y="1031" font-size="16" font-weight="600" text-anchor="start">Reuse is not parallel: each response finishes before the next request goes out.</text>
    <text x="32" y="1055" font-size="16" text-anchor="start">Pipelining exists, but replies must return in order, so browsers skip it.</text>
    <text x="410.0" y="1111" font-size="13" fill="#475569" text-anchor="middle">Plain HTTP shown. Data ACKs and the TIME-WAIT period after closing are omitted.</text>
  </g>
</svg>