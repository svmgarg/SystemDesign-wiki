<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1342" viewBox="0 0 820 1342" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest></c2pa:manifest>
  </metadata>
  <title id="t">HTTP/2: many conversations on one connection</title>
  <desc id="d">After TCP, TLS and HTTP/2 setup, the browser sends product, reviews and delivery requests on streams 1, 3 and 5 without waiting. The server returns DATA frames interleaved: product 1, reviews 1, delivery 1, then piece 2 of each. Stream numbers identify each response and order inside each stream is kept.</desc>
  <defs>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155" />
    </marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#0284c7" />
    </marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#15803d" />
    </marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#a16207" />
    </marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#b91c1c" />
    </marker>
    <marker id="mp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#6d28d9" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f1f5f9" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3" />
    </pattern>
  </defs>
  <rect width="820" height="1342" rx="12" fill="#fff" />
  <g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
    <text x="410.0" y="36" font-size="24" font-weight="600" text-anchor="middle">HTTP/2: many conversations on one connection</text>
    <text x="410.0" y="62" font-size="15" fill="#475569" text-anchor="middle">Fresh HTTPS connection · time flows downward</text>
    <rect x="25" y="80" width="170" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" />
    <text x="110" y="106" font-size="16" font-weight="600" text-anchor="middle">Browser (client)</text>
    <rect x="315" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" />
    <text x="400" y="106" font-size="16" font-weight="600" text-anchor="middle">Server</text>
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 120V1080M400 120V1080" />
    </g>
    <rect x="16" y="140" width="788" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 180V310M400 180V310" />
    </g>
    <text x="32" y="166" font-size="16" font-weight="600" text-anchor="start">1 · Open TCP once</text>
    <path d="M110 202H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="193" font-size="15" fill="#0f172a" text-anchor="middle">SYN</text>
    <path d="M400 248H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="239" font-size="15" fill="#0f172a" text-anchor="middle">SYN-ACK</text>
    <path d="M110 294H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="285" font-size="15" fill="#0f172a" text-anchor="middle">ACK</text>
    <rect x="16" y="326" width="788" height="124" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 366V450M400 366V450" />
    </g>
    <text x="32" y="352" font-size="16" font-weight="600" text-anchor="start">2 · Secure it and agree on HTTP/2</text>
    <path d="M110 388H400" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)" marker-start="url(#mp)" />
    <text x="255" y="379" font-size="15" fill="#5b21b6" text-anchor="middle">TLS handshake · ALPN picks h2</text>
    <path d="M110 434H400" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#mp)" marker-start="url(#mp)" />
    <text x="255" y="425" font-size="15" fill="#5b21b6" text-anchor="middle">HTTP/2 SETTINGS exchange</text>
    <text x="432" y="378" font-size="14" fill="#1e293b" text-anchor="start">ALPN: client and server agree on</text>
    <text x="432" y="397" font-size="14" fill="#1e293b" text-anchor="start">the protocol during the TLS handshake.</text>
    <rect x="16" y="466" width="788" height="170" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 506V636M400 506V636" />
    </g>
    <text x="32" y="492" font-size="16" font-weight="600" text-anchor="start">3 · Three requests, no waiting</text>
    <path d="M110 528H400" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mb)" />
    <text x="255" y="519" font-size="15" font-weight="600" fill="#075985" text-anchor="middle">Stream 1 · GET /products/p123</text>
    <path d="M110 574H400" stroke="#15803d" stroke-width="2.5" marker-end="url(#mg)" />
    <text x="255" y="565" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">Stream 3 · GET /reviews</text>
    <path d="M110 620H400" stroke="#a16207" stroke-width="2.5" marker-end="url(#ma)" />
    <text x="255" y="611" font-size="15" font-weight="600" fill="#854d0e" text-anchor="middle">Stream 5 · GET /delivery</text>
    <text x="432" y="518" font-size="14" fill="#1e293b" text-anchor="start">A stream is one numbered</text>
    <text x="432" y="537" font-size="14" fill="#1e293b" text-anchor="start">request/response conversation.</text>
    <text x="432" y="556" font-size="14" fill="#1e293b" text-anchor="start">The browser did not wait for any</text>
    <text x="432" y="575" font-size="14" fill="#1e293b" text-anchor="start">response before sending the next.</text>
    <rect x="16" y="652" width="788" height="308" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 692V960M400 692V960" />
    </g>
    <text x="32" y="678" font-size="16" font-weight="600" text-anchor="start">4 · Responses arrive interleaved</text>
    <path d="M400 714H110" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mb)" />
    <text x="255" y="705" font-size="15" font-weight="600" fill="#075985" text-anchor="middle">S1 · product · piece 1</text>
    <path d="M400 760H110" stroke="#15803d" stroke-width="2.5" marker-end="url(#mg)" />
    <text x="255" y="751" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">S3 · reviews · piece 1</text>
    <path d="M400 806H110" stroke="#a16207" stroke-width="2.5" marker-end="url(#ma)" />
    <text x="255" y="797" font-size="15" font-weight="600" fill="#854d0e" text-anchor="middle">S5 · delivery · piece 1</text>
    <path d="M400 852H110" stroke="#0284c7" stroke-width="2.5" marker-end="url(#mb)" />
    <text x="255" y="843" font-size="15" font-weight="600" fill="#075985" text-anchor="middle">S1 · product · piece 2 (last)</text>
    <path d="M400 898H110" stroke="#15803d" stroke-width="2.5" marker-end="url(#mg)" />
    <text x="255" y="889" font-size="15" font-weight="600" fill="#166534" text-anchor="middle">S3 · reviews · piece 2 (last)</text>
    <path d="M400 944H110" stroke="#a16207" stroke-width="2.5" marker-end="url(#ma)" />
    <text x="255" y="935" font-size="15" font-weight="600" fill="#854d0e" text-anchor="middle">S5 · delivery · piece 2 (last)</text>
    <text x="432" y="704" font-size="14" fill="#1e293b" text-anchor="start">Each piece (a DATA frame) carries its</text>
    <text x="432" y="723" font-size="14" fill="#1e293b" text-anchor="start">stream number, so the browser sorts</text>
    <text x="432" y="742" font-size="14" fill="#1e293b" text-anchor="start">pieces back into three responses.</text>
    <text x="432" y="761" font-size="14" fill="#1e293b" text-anchor="start"></text>
    <text x="432" y="780" font-size="14" fill="#1e293b" text-anchor="start">Order inside one stream is kept.</text>
    <text x="432" y="799" font-size="14" fill="#1e293b" text-anchor="start"></text>
    <text x="432" y="818" font-size="14" fill="#1e293b" text-anchor="start">This is one example order. The server</text>
    <text x="432" y="837" font-size="14" fill="#1e293b" text-anchor="start">may answer sooner or finish in a</text>
    <text x="432" y="856" font-size="14" fill="#1e293b" text-anchor="start">different order.</text>
    <rect x="16" y="976" width="788" height="104" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 1016V1080M400 1016V1080" />
    </g>
    <text x="32" y="1002" font-size="16" font-weight="600" text-anchor="start">5 · Reuse, or shut down</text>
    <path d="M110 1038H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" marker-start="url(#mk)" />
    <text x="255" y="1029" font-size="15" fill="#0f172a" text-anchor="middle">GOAWAY → TLS close → FIN / ACK</text>
    <text x="432" y="1028" font-size="14" fill="#1e293b" text-anchor="start">Finishing a stream does not</text>
    <text x="432" y="1047" font-size="14" fill="#1e293b" text-anchor="start">close the connection.</text>
    <rect x="16" y="1096" width="788" height="92" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" />
    <text x="32" y="1124" font-size="15" font-weight="600" fill="#92400e" text-anchor="start">Key idea</text>
    <text x="32" y="1150" font-size="16" font-weight="600" text-anchor="start">One connection carries many conversations at once.</text>
    <text x="32" y="1174" font-size="16" text-anchor="start">Weak spot: missing TCP bytes can delay later data on every stream.</text>
    <rect x="16" y="1204" width="788" height="122" rx="12" fill="#f8fafc" stroke="#94a3b8" />
    <text x="32" y="1228" font-size="14" font-weight="600" fill="#475569" text-anchor="start">Words in this diagram</text>
    <text x="32" y="1252" font-size="14" font-weight="600" text-anchor="start">Stream</text>
    <text x="170" y="1252" font-size="14" fill="#1e293b" text-anchor="start">one numbered request/response conversation (client-started ones are odd)</text>
    <text x="32" y="1274" font-size="14" font-weight="600" text-anchor="start">Frame</text>
    <text x="170" y="1274" font-size="14" fill="#1e293b" text-anchor="start">small labelled piece of a message; DATA frames carry body bytes</text>
    <text x="32" y="1296" font-size="14" font-weight="600" text-anchor="start">HEADERS</text>
    <text x="170" y="1296" font-size="14" fill="#1e293b" text-anchor="start">frame holding status and headers; response HEADERS (:status 200) are omitted here</text>
    <text x="32" y="1318" font-size="14" font-weight="600" text-anchor="start">GOAWAY</text>
    <text x="170" y="1318" font-size="14" fill="#1e293b" text-anchor="start">shutdown notice specifying the last stream the peer might have processed</text>
  </g>
</svg>