<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1168" viewBox="0 0 820 1168" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <metadata>
    <c2pa:manifest></c2pa:manifest>
  </metadata>
  <title id="t">HTTP/1.0: every request pays for a new connection</title>
  <desc id="d">Browser and server do a TCP handshake, exchange GET /users and a 200 OK, and the server closes. Fetching /orders needs a second handshake, request, response and close.</desc>
  <defs>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#334155" />
    </marker>
    <marker id="mb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#0284c7" />
    </marker>
    <marker id="mg" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#15803d" />
    </marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#a16207" />
    </marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#b91c1c" />
    </marker>
    <marker id="mp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse">
      <path d="M0 0L9 4.5L0 9Z" fill="#6d28d9" />
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f1f5f9" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#94a3b8" stroke-width="3" />
    </pattern>
  </defs>
  <rect width="820" height="1168" rx="12" fill="#fff" />
  <g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
    <text x="410.0" y="36" font-size="24" font-weight="600" text-anchor="middle">HTTP/1.0: every request pays for a new connection</text>
    <text x="410.0" y="62" font-size="15" fill="#475569" text-anchor="middle">Plain HTTP · default behavior · time flows downward</text>
    <rect x="25" y="80" width="170" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" />
    <text x="110" y="106" font-size="16" font-weight="600" text-anchor="middle">Browser (client)</text>
    <rect x="315" y="80" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" />
    <text x="400" y="106" font-size="16" font-weight="600" text-anchor="middle">Server</text>
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 120V990M400 120V990" />
    </g>
    <rect x="16" y="140" width="788" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 180V310M400 180V310" />
    </g>
    <text x="32" y="166" font-size="16" font-weight="600" text-anchor="start">1 · Open connection A</text>
    <path d="M110 202H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="193" font-size="15" fill="#0f172a" text-anchor="middle">SYN</text>
    <path d="M400 248H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="239" font-size="15" fill="#0f172a" text-anchor="middle">SYN-ACK</text>
    <path d="M110 294H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="285" font-size="15" fill="#0f172a" text-anchor="middle">ACK</text>
    <text x="432" y="192" font-size="14" fill="#1e293b" text-anchor="start">Three-way handshake: sets up TCP only.</text>
    <text x="432" y="211" font-size="14" fill="#1e293b" text-anchor="start">No HTTP has been sent yet.</text>
    <rect x="16" y="326" width="788" height="124" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 366V450M400 366V450" />
    </g>
    <text x="32" y="352" font-size="16" font-weight="600" text-anchor="start">2 · Ask for /users</text>
    <path d="M110 388H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="379" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">GET /users HTTP/1.0</text>
    <path d="M400 434H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="425" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">200 OK + user data</text>
    <text x="432" y="378" font-size="14" fill="#1e293b" text-anchor="start">One request, one complete response.</text>
    <rect x="16" y="466" width="788" height="104" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 506V570M400 506V570" />
    </g>
    <text x="32" y="492" font-size="16" font-weight="600" text-anchor="start">3 · Server closes connection A</text>
    <path d="M110 528H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" marker-start="url(#mk)" />
    <text x="255" y="519" font-size="15" fill="#0f172a" text-anchor="middle">FIN / ACK (summarized)</text>
    <text x="432" y="518" font-size="14" fill="#1e293b" text-anchor="start">HTTP/1.0 normally hangs up after</text>
    <text x="432" y="537" font-size="14" fill="#1e293b" text-anchor="start">every response. Connection A is gone.</text>
    <rect x="16" y="586" width="788" height="170" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 626V756M400 626V756" />
    </g>
    <text x="32" y="612" font-size="16" font-weight="600" text-anchor="start">4 · Open a NEW connection B</text>
    <path d="M110 648H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="639" font-size="15" fill="#0f172a" text-anchor="middle">SYN</text>
    <path d="M400 694H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="685" font-size="15" fill="#0f172a" text-anchor="middle">SYN-ACK</text>
    <path d="M110 740H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="731" font-size="15" fill="#0f172a" text-anchor="middle">ACK</text>
    <text x="432" y="638" font-size="14" fill="#1e293b" text-anchor="start">Same handshake again: another round</text>
    <text x="432" y="657" font-size="14" fill="#1e293b" text-anchor="start">trip of waiting before /orders can</text>
    <text x="432" y="676" font-size="14" fill="#1e293b" text-anchor="start">even be asked for.</text>
    <rect x="16" y="772" width="788" height="124" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 812V896M400 812V896" />
    </g>
    <text x="32" y="798" font-size="16" font-weight="600" text-anchor="start">5 · Ask for /orders</text>
    <path d="M110 834H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="825" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">GET /orders HTTP/1.0</text>
    <path d="M400 880H110" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" />
    <text x="255" y="871" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">200 OK + order data</text>
    <text x="432" y="824" font-size="14" fill="#1e293b" text-anchor="start">Same pattern, on the new connection.</text>
    <rect x="16" y="912" width="788" height="78" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
    <g stroke="#64748b" stroke-width="2" stroke-dasharray="6 6">
      <path d="M110 952V990M400 952V990" />
    </g>
    <text x="32" y="938" font-size="16" font-weight="600" text-anchor="start">6 · Server closes connection B</text>
    <path d="M110 974H400" stroke="#334155" stroke-width="2.5" marker-end="url(#mk)" marker-start="url(#mk)" />
    <text x="255" y="965" font-size="15" fill="#0f172a" text-anchor="middle">FIN / ACK (summarized)</text>
    <rect x="16" y="1006" width="788" height="92" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" />
    <text x="32" y="1034" font-size="15" font-weight="600" fill="#92400e" text-anchor="start">Key idea</text>
    <text x="32" y="1060" font-size="16" font-weight="600" text-anchor="start">Every request pays for 1 handshake and 1 close.</text>
    <text x="32" y="1084" font-size="16" text-anchor="start">HTTP/1.1 removes that cost by keeping the connection open for reuse.</text>
    <text x="410.0" y="1140" font-size="13" fill="#475569" text-anchor="middle">Plain HTTP shown. An optional keep-alive extension exists but is not the default.</text>
    <text x="410.0" y="1162" font-size="13" fill="#475569" text-anchor="middle">FIN / ACK arrows summarize several TCP segments.</text>
  </g>
</svg>