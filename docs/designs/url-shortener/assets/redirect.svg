<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-labelledby="title desc">
  <title id="title">Opening a short URL</title>
  <desc id="desc">The browser requests a short URL. The service finds the mapping in its database and returns a 302 response with a Location header. The browser then requests the original website directly.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="720" height="190" rx="12" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="16" y="20" width="150" height="150" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="91" y="51" font-size="16">1. Browser opens</text>
    <text x="91" y="73" font-size="16">the short URL</text>
    <text x="91" y="114" font-size="14">GET /system-design</text>
    <path d="M174 95H188" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="196" y="20" width="150" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="271" y="51" font-size="16">2. Service finds</text>
    <text x="271" y="73" font-size="16">the mapping</text>
    <text x="271" y="114" font-size="14">Read the database</text>
    <text x="271" y="134" font-size="14">using the key</text>
    <path d="M354 95H368" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="376" y="20" width="150" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="451" y="51" font-size="16">3. Service returns</text>
    <text x="451" y="73" font-size="16">the redirect</text>
    <text x="451" y="114" font-size="14">302 + Location:</text>
    <text x="451" y="134" font-size="14">original URL</text>
    <path d="M534 95H548" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="556" y="20" width="150" height="150" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="631" y="51" font-size="16">4. Browser follows</text>
    <text x="631" y="73" font-size="16">Location</text>
    <text x="631" y="114" font-size="14">Request original</text>
    <text x="631" y="134" font-size="14">website directly</text>
  </g>
</svg>
