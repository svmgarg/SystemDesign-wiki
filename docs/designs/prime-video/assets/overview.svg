<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="460" viewBox="0 0 1550 460" role="img" aria-labelledby="title desc">
  <title id="title">Prime-like video upload and processing</title>
  <desc id="desc">The creator requests upload authorization from the Upload API and sends video parts directly to source S3 storage. Finalization records metadata and an outbox event. Processing queues feed a media-aware planner and encoder workers. Workers read the source and write validated packaged outputs for CDN delivery to viewers.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1550" height="460" rx="12" fill="#f8fafc"/>
  <g fill="#ffffff" stroke="#64748b" stroke-width="2">
    <rect x="20" y="55" width="180" height="80" rx="8"/>
    <rect x="270" y="55" width="220" height="80" rx="8"/>
    <rect x="540" y="55" width="220" height="80" rx="8"/>
    <rect x="810" y="55" width="220" height="80" rx="8"/>
    <rect x="1080" y="55" width="220" height="80" rx="8"/>
    <rect x="270" y="265" width="220" height="80" rx="8" fill="#e0f2fe"/>
    <rect x="810" y="265" width="220" height="80" rx="8"/>
    <rect x="1080" y="265" width="220" height="80" rx="8" fill="#e0f2fe"/>
    <rect x="1370" y="265" width="160" height="80" rx="8"/>
    <rect x="1370" y="385" width="160" height="55" rx="8"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
    <path d="M200 95 H270"/>
    <path d="M490 95 H540"/>
    <path d="M760 95 H810"/>
    <path d="M1030 95 H1080"/>
    <path d="M110 135 V305 H270" stroke-dasharray="7 4"/>
    <path d="M380 135 V265"/>
    <path d="M490 305 H810"/>
    <path d="M1190 135 V210 H920 V265"/>
    <path d="M1030 305 H1080"/>
    <path d="M1300 305 H1370"/>
    <path d="M1450 345 V385"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle" font-size="17">
    <text x="110" y="102">Content provider</text>
    <text x="380" y="88">Upload API</text>
    <text x="380" y="113">Authorize / finalize</text>
    <text x="650" y="88">Metadata database</text>
    <text x="650" y="113">State + outbox</text>
    <text x="920" y="88">Durable processing</text>
    <text x="920" y="113">queue</text>
    <text x="1190" y="88">Video splitter</text>
    <text x="1190" y="113">Media-aware planner</text>
    <text x="380" y="298">Source S3 bucket</text>
    <text x="380" y="323">Original video</text>
    <text x="920" y="298">Encoder workers</text>
    <text x="920" y="323">Assemble / package</text>
    <text x="1190" y="298">Output S3 bucket</text>
    <text x="1190" y="323">Validated renditions</text>
    <text x="1450" y="312">CDN</text>
    <text x="1450" y="420">Viewer</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#475569" font-size="15">
    <text x="125" y="210">Direct file bytes</text>
    <text x="395" y="182">Complete and</text>
    <text x="395" y="202">verify in S3</text>
    <text x="575" y="290">Read source media</text>
    <text x="955" y="195">Encoding jobs via queue</text>
    <text x="1325" y="246">Delivery</text>
    <text x="30" y="428">Control requests and media bytes use separate paths. Playback authorization is described in the notes.</text>
  </g>
</svg>
