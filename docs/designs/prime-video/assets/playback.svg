<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Video playback control and media delivery</title>
  <desc id="desc">The viewer obtains a playback session and manifest authorization from the Video View Service, which checks catalog and entitlement data. Media requests separately pass through an authorized CDN and optional origin shield to private playback storage. The application service does not relay video bytes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="380" rx="12" fill="#f8fafc"/>
  <g fill="#ffffff" stroke="#64748b" stroke-width="2">
    <rect x="20" y="140" width="180" height="90" rx="8"/>
    <rect x="310" y="30" width="220" height="80" rx="8"/>
    <rect x="650" y="30" width="240" height="80" rx="8"/>
    <rect x="310" y="260" width="220" height="80" rx="8" fill="#e0f2fe"/>
    <rect x="650" y="260" width="220" height="80" rx="8"/>
    <rect x="950" y="260" width="230" height="80" rx="8" fill="#e0f2fe"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M110 140 V70 H310"/>
    <path d="M530 70 H650"/>
    <path d="M110 230 V300 H310"/>
    <path d="M530 300 H650"/>
    <path d="M870 300 H950"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#0f172a" text-anchor="middle" font-size="17">
    <text x="110" y="178">Viewer</text>
    <text x="110" y="203">Playback client</text>
    <text x="420" y="63">Video View Service</text>
    <text x="420" y="88">Session + authorization</text>
    <text x="770" y="63">Catalog / entitlement</text>
    <text x="770" y="88">Rights + readiness checks</text>
    <text x="420" y="293">CDN edge</text>
    <text x="420" y="318">Authorize + cache</text>
    <text x="760" y="293">Origin shield</text>
    <text x="760" y="318">Shared upstream cache</text>
    <text x="1065" y="293">Private S3 origin</text>
    <text x="1065" y="318">Published outputs</text>
  </g>
  <g font-family="Arial, sans-serif" fill="#475569" font-size="15">
    <text x="130" y="48">1. Playback control</text>
    <text x="130" y="279">2. Media bytes</text>
    <text x="545" y="245">Cache misses</text>
    <text x="885" y="245">Misses</text>
    <text x="310" y="165">The backend returns a manifest address, not the source movie.</text>
    <text x="310" y="190">DRM licenses and viewing telemetry use separate control flows.</text>
    <text x="20" y="365">Arrows show requests and responses. Authorization applies even when an edge serves cached media.</text>
  </g>
</svg>
