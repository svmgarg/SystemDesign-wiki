<svg xmlns="http://www.w3.org/2000/svg" width="360" height="388" viewBox="0 0 360 388" role="img" aria-labelledby="title desc">
  <title id="title">Cache-aside read flow</title>
  <desc id="desc">The application checks the cache. On a usable hit it returns the value. On a miss it reads the database, saves a temporary cache copy, and returns the database result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="360" height="388" rx="12" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="20" y="16" width="320" height="52" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="180" y="48" font-size="18">1. Application checks the cache</text>
    <path d="M180 69V95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="102" width="320" height="62" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="180" y="127" font-size="18">Usable hit? Return the copy.</text>
    <text x="180" y="150" font-size="16">Otherwise, follow the miss path.</text>
    <path d="M180 165V191" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="198" width="320" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="180" y="223" font-size="18">2. Application reads the database</text>
    <text x="180" y="246" font-size="16">Within the fallback budget</text>
    <path d="M180 261V287" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="294" width="320" height="72" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="180" y="320" font-size="18">3. Save a temporary cache copy</text>
    <text x="180" y="345" font-size="16">Return the database result</text>
  </g>
</svg>
