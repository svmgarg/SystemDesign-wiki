<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="title desc">
  <title id="title">Cache-aside read flow</title>
  <desc id="desc">The application checks the cache. On a usable hit it returns the value. On a miss it reads the database, saves a temporary cache copy, and returns the database result.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="190" rx="12" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="16" y="20" width="200" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="116" y="53" font-size="18">1. Check the cache</text>
    <text x="116" y="98" font-size="15">Application sends a key</text>
    <path d="M224 95H240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="248" y="20" width="200" height="150" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="348" y="53" font-size="18">Usable hit?</text>
    <text x="348" y="98" font-size="15">Yes: return the copy</text>
    <text x="348" y="124" font-size="15">No: follow the miss path</text>
    <path d="M456 95H472" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="480" y="20" width="216" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="588" y="53" font-size="18">2. Read the database</text>
    <text x="588" y="98" font-size="15">Obtain a fallback permit</text>
    <text x="588" y="124" font-size="15">Respect the database budget</text>
    <path d="M704 95H720" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="728" y="20" width="216" height="150" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="836" y="53" font-size="18">3. Fill and return</text>
    <text x="836" y="98" font-size="15">Save a temporary cache copy</text>
    <text x="836" y="124" font-size="15">Return the database result</text>
  </g>
</svg>
