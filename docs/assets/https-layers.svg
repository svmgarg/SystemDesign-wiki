<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">HTTP, TLS, and TCP have different jobs</title>
  <desc id="desc">For HTTP/1.1 or HTTP/2 over HTTPS, outgoing HTTP data passes through TLS encryption, then TCP delivery, then the network. The server reverses these steps. HTTP/3 instead uses QUIC with TLS 1.3 over UDP.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="640" height="420" rx="12" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#0f172a">
    <text x="320" y="32" font-size="20" font-weight="600">HTTPS with HTTP/1.1 or HTTP/2</text>
    <text x="320" y="57" font-size="15">Follow outgoing data from the client to the network</text>
    <rect x="70" y="78" width="500" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="320" y="103" font-size="18" font-weight="600">HTTP: describe the request</text>
    <text x="320" y="125" font-size="15">GET /products/p123, headers, and optional body</text>
    <path d="M320 144V164" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="174" width="500" height="62" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="320" y="199" font-size="18" font-weight="600">TLS: protect the communication</text>
    <text x="320" y="221" font-size="15">Encrypt data, detect changes, verify the server</text>
    <path d="M320 240V260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="270" width="500" height="62" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="320" y="295" font-size="18" font-weight="600">TCP: carry the encrypted bytes</text>
    <text x="320" y="317" font-size="15">Recover lost data and deliver bytes in order</text>
    <path d="M320 336V356" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="320" y="382" font-size="18">Network</text>
    <text x="320" y="406" font-size="14">The receiving server processes these layers in reverse.</text>
  </g>
</svg>
