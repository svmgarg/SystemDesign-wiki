<svg xmlns="http://www.w3.org/2000/svg" width="360" height="410" viewBox="0 0 360 410" role="img" aria-labelledby="title desc">
  <title id="title">Cache routing and replication</title>
  <desc id="desc">The application passes a key to its cache client library. The library hashes the key and uses its locally saved topology map to choose the primary node. The primary serves the request and copies changes asynchronously to its replica. Normal reads do not call the coordinator.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="360" height="410" rx="12" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="20" y="16" width="320" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="180" y="48" font-size="18">Application requests a key</text>
    <path d="M180 69V95" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="102" width="320" height="76" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="180" y="128" font-size="18">Cache client library (CC)</text>
    <text x="180" y="151" font-size="16">Hash key + use local topology map</text>
    <text x="180" y="170" font-size="15">Select the primary node</text>
    <path d="M180 179V205" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="20" y="212" width="320" height="62" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="180" y="237" font-size="18">Primary cache node</text>
    <text x="180" y="260" font-size="16">Serve the cache request</text>
    <path d="M180 275V317" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="70" y="282" width="220" height="23" fill="#fff"/>
    <text x="180" y="299" font-size="16">Copy changes asynchronously</text>
    <rect x="20" y="324" width="320" height="62" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="180" y="349" font-size="18">Replica cache node</text>
    <text x="180" y="372" font-size="16">Can lag; failover needs coordination</text>
  </g>
</svg>
