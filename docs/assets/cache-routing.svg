<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
  <title id="title">Cache routing and replication</title>
  <desc id="desc">The application passes a key to its cache client library. The library hashes the key and uses its locally saved topology map to choose the primary node. The primary serves the request and copies changes asynchronously to its replica. Normal reads do not call the coordinator.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="960" height="210" rx="12" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="16" y="30" width="200" height="150" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="116" y="67" font-size="18">Application</text>
    <text x="116" y="111" font-size="15">Request a key</text>
    <path d="M224 105H240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="248" y="30" width="216" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="356" y="67" font-size="18">Cache client (CC)</text>
    <text x="356" y="104" font-size="15">Hash the complete key</text>
    <text x="356" y="128" font-size="15">Use the local topology map</text>
    <text x="356" y="152" font-size="15">Choose the primary</text>
    <path d="M472 105H488" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="496" y="30" width="200" height="150" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="596" y="67" font-size="18">Primary node</text>
    <text x="596" y="111" font-size="15">Serve the cache request</text>
    <text x="596" y="139" font-size="15">Replicate asynchronously</text>
    <path d="M704 105H720" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="728" y="30" width="216" height="150" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="836" y="67" font-size="18">Replica node</text>
    <text x="836" y="104" font-size="15">May lag behind the primary</text>
    <text x="836" y="128" font-size="15">Failover needs coordination</text>
  </g>
</svg>
