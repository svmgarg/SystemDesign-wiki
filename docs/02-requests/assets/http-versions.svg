<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">How HTTP versions share connections</title>
  <desc id="desc">HTTP/1.1 establishes one TCP connection and exchanges three requests with complete responses in sequence. HTTP/2 shows three requests reaching the server on streams 1, 3, and 5, followed by interleaved response chunks: product 1, reviews 1, delivery 1, product 2, reviews 2, delivery 2. Time flows down, and each stream retains its chunk order. This example does not require the server to wait for all requests before responding. HTTP/3 uses QUIC streams where missing data in one stream need not block delivery in another.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
  </defs>
  <rect width="720" height="1280" rx="12" fill="#fff"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#0f172a">
    <text x="24" y="32" font-size="20" font-weight="600">Three requests: product, reviews, and delivery</text>
    <rect x="16" y="50" width="688" height="390" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="34" y="78" font-size="18" font-weight="600">HTTP/1.1: three requests on ONE TCP connection</text>
    <text x="34" y="103" font-size="15">Establish TCP once, then follow the exchanges from top to bottom.</text>
    <rect x="90" y="118" width="545" height="220" rx="8" fill="#fff" stroke="#64748b" stroke-dasharray="5 4"/>
    <text x="105" y="139" font-size="15">Client</text>
    <text x="561" y="139" font-size="15">Server</text>
    <g stroke="#94a3b8" stroke-dasharray="4 4">
      <path d="M105 146V326M610 146V326"/>
    </g>
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M105 175H610"/>
      <path d="M610 203H105"/>
      <path d="M105 231H610"/>
      <path d="M610 259H105"/>
      <path d="M105 287H610"/>
      <path d="M610 315H105"/>
    </g>
    <g text-anchor="middle" font-size="15">
      <text x="355" y="166" fill="#075985">Product request</text>
      <text x="355" y="194" fill="#075985">Complete product response</text>
      <text x="355" y="222" fill="#166534">Reviews request</text>
      <text x="355" y="250" fill="#166534">Complete reviews response</text>
      <text x="355" y="278" fill="#854d0e">Delivery request</text>
      <text x="355" y="306" fill="#854d0e">Complete delivery response</text>
    </g>
    <text x="34" y="366" font-size="15">Then: reuse again, or close with FIN/ACK exchanges.</text>
    <text x="34" y="394" font-size="15" font-weight="600">HTTP/1.1 cannot multiplex chunks from different exchanges.</text>
    <text x="34" y="420" font-size="14">Common non-pipelined flow: each response completes before the next request.</text>
    <g transform="translate(0 210)">
    <rect x="16" y="248" width="688" height="570" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="34" y="278" font-size="18" font-weight="600">HTTP/2: mix response chunks on ONE TCP connection</text>
    <text x="34" y="304" font-size="14">Time flows downward; all arrows share one TCP connection.</text>
    <rect x="90" y="320" width="545" height="360" rx="8" fill="#fff" stroke="#64748b" stroke-dasharray="5 4"/>
    <text x="105" y="343" font-size="15">Client</text>
    <text x="561" y="343" font-size="15">Server</text>
    <path d="M105 350V666M610 350V666" stroke="#94a3b8" stroke-dasharray="4 4"/>
    <g stroke-width="2" marker-end="url(#arrow)">
      <path d="M105 379H610M610 493H105M610 595H105" stroke="#0284c7"/>
      <path d="M105 413H610M610 527H105M610 629H105" stroke="#15803d"/>
      <path d="M105 447H610M610 561H105M610 663H105" stroke="#a16207"/>
    </g>
    <g text-anchor="middle" font-size="15">
      <text x="355" y="370" fill="#075985">Product request (stream 1)</text>
      <text x="355" y="404" fill="#166534">Reviews request (stream 3)</text>
      <text x="355" y="438" fill="#854d0e">Delivery request (stream 5)</text>
      <text x="355" y="484" fill="#075985" font-weight="600">Product response: chunk 1 (stream 1)</text>
      <text x="355" y="518" fill="#166534" font-weight="600">Reviews response: chunk 1 (stream 3)</text>
      <text x="355" y="552" fill="#854d0e" font-weight="600">Delivery response: chunk 1 (stream 5)</text>
      <text x="355" y="586" fill="#075985" font-weight="600">Product response: chunk 2 (stream 1)</text>
      <text x="355" y="620" fill="#166534" font-weight="600">Reviews response: chunk 2 (stream 3)</text>
      <text x="355" y="654" fill="#854d0e" font-weight="600">Delivery response: chunk 2 (stream 5)</text>
    </g>
    <text x="34" y="706" font-size="15" font-weight="600">Response chunks CAN interleave; stream IDs identify each response.</text>
    <text x="34" y="731" font-size="15">Within each stream, chunk 1 still arrives before chunk 2.</text>
    <text x="34" y="756" font-size="14">Example order only: the server need not wait for all three requests.</text>
    <text x="34" y="781" font-size="14">Response HEADERS omitted. Each chunk is a DATA frame.</text>
    <text x="34" y="806" font-size="14">Missing TCP bytes can hold up delivery for every stream.</text>
    <g transform="translate(0 380)">
    <rect x="16" y="456" width="688" height="218" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="34" y="486" font-size="18" font-weight="600">HTTP/3: independent delivery on QUIC streams</text>
    <rect x="105" y="503" width="505" height="120" rx="8" fill="#fff" stroke="#64748b" stroke-dasharray="5 4"/>
    <g stroke="#475569" stroke-width="2" marker-end="url(#arrow)">
      <path d="M120 526H590"/>
      <path d="M120 563H590"/>
      <path d="M120 600H590"/>
    </g>
    <g text-anchor="middle" font-size="15">
      <rect x="205" y="511" width="300" height="24" rx="4" fill="#e0f2fe"/>
      <text x="355" y="528">Product stream</text>
      <rect x="205" y="548" width="300" height="24" rx="4" fill="#dcfce7"/>
      <text x="355" y="565">Reviews stream</text>
      <rect x="205" y="585" width="300" height="24" rx="4" fill="#fef3c7"/>
      <text x="355" y="602">Delivery stream</text>
    </g>
    <text x="34" y="646" font-size="15">One QUIC connection over UDP, with TLS 1.3 security.</text>
    <text x="34" y="666" font-size="15">Loss in one stream need not block delivery on other streams.</text>
    </g>
    </g>
  </g>
</svg>
