site_name: System Design Wiki
site_description: A focused beginner course with worked designs and exercises.
docs_dir: docs
site_dir: site
theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
plugins:
  - search
extra_css:
  - stylesheets/extra.css
nav:
  - Start here: index.md
  - Foundations:
      - Requirements: 01-thinking.md
      - Networking & APIs: 02-requests.md
      - Storage: 03-storage.md
      - Scaling & Caching: 04-scaling.md
      - Messaging: 05-async.md
      - Reliability: 06-reliability.md
      - Security & Operations: 07-operations.md
  - Designs:
      - URL Shortener: designs/url-shortener.md
      - Notifications: designs/notification-service.md
      - Distributed Cache: designs/distributed-cache.md
  - Practice:
      - Exercises & Reference: 10-practice.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
